name: Build Android APK

on:
  push:
    branches: [ main, master, build/apk-debug ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer cython==0.29.33

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK and NDK
        run: |
          set -e
          mkdir -p /tmp/android-sdk
          cd /tmp/android-sdk
          
          # Download Android command-line tools
          curl -sSL https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -o cmdline.zip
          unzip -q cmdline.zip
          mkdir -p cmdline-tools/latest
          mv cmdline-tools/bin cmdline-tools/lib cmdline-tools/source.properties cmdline-tools/latest/ 2>/dev/null || true
          
          # Set up PATH
          export PATH="/tmp/android-sdk/cmdline-tools/latest/bin:$PATH"
          export ANDROID_SDK_ROOT="/tmp/android-sdk"
          
          # Accept licenses and install components
          yes | sdkmanager --sdk_root="/tmp/android-sdk" --licenses || true
          sdkmanager --sdk_root="/tmp/android-sdk" "platform-tools"
          sdkmanager --sdk_root="/tmp/android-sdk" "platforms;android-31"
          sdkmanager --sdk_root="/tmp/android-sdk" "build-tools;33.0.2"
          sdkmanager --sdk_root="/tmp/android-sdk" "ndk;25.1.8937393"

      - name: Run Buildozer
        env:
          ANDROID_SDK_ROOT: /tmp/android-sdk
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          set -o pipefail
          mkdir -p build_logs
          buildozer android debug 2>&1 | tee build_logs/buildozer.log || true

      - name: Check for APK
        run: |
          find . -name "*.apk" -type f 2>/dev/null || echo "No APK found yet"
          find .buildozer -name "*.apk" -type f 2>/dev/null || echo "No APK in .buildozer"
          ls -lah bin/ 2>/dev/null || echo "bin/ directory not found"

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            bin/*.apk
            bin/*.aab
          if-no-files-found: warn

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build_logs/
          if-no-files-found: warn

name: Build Android APK (Simplified)

on:
  push:
    branches: [ main, master, build/apk-debug ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 600
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libffi-dev \
            libssl-dev \
            libjpeg-dev \
            zlib1g-dev \
            libtiff-dev \
            libopenjp2-7-dev \
            libtk-img-dev \
            autoconf \
            libtool \
            pkg-config \
            m4
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer cython==0.29.33

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.android
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Build APK
        run: |
          export JAVA_HOME=$JAVA_HOME_17_X64
          buildozer -v android debug 2>&1 | tail -200
        timeout-minutes: 600

      - name: Check output
        run: |
          ls -lah bin/ 2>/dev/null || echo "No bin folder"
          find . -name "*.apk" -type f 2>/dev/null | head -5

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: bin/*.apk
          retention-days: 30

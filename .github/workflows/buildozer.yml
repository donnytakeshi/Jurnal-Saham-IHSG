name: Build Android APK

on:
  push:
    branches: [ main, master, build/apk-debug ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer cython==0.29.33

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android command-line tools
        run: |
          set -e
          sdk_root="$ANDROID_SDK_ROOT"
          mkdir -p "$sdk_root"
          cd "$sdk_root"
          curl -sSL https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -o cmdline.zip
          unzip -q cmdline.zip -d cmdline-tools
          mkdir -p cmdline-tools/latest
          mv cmdline-tools/cmdline-tools/* cmdline-tools/latest/ || true
          export PATH="$sdk_root/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --sdk_root="$sdk_root" --licenses || true
          sdkmanager --sdk_root="$sdk_root" "platform-tools" "platforms;android-31" "build-tools;33.0.2" "ndk;25.1.8937393"

      - name: Run Buildozer
        run: |
          set -o pipefail
          mkdir -p build_logs
          buildozer -v android debug 2>&1 | tee build_logs/buildozer.log || true

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            bin/*.apk
            bin/*.aab

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build_logs/

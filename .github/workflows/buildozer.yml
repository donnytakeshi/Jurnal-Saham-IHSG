name: Build Android APK (Clean)

on:
  push:
    branches: [ main, master, build/apk-debug ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Clean previous builds
        run: |
          rm -rf .buildozer bin/ build_logs/
          mkdir -p build_logs

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer cython==0.29.33

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK and NDK
        run: |
          set -e
          mkdir -p /tmp/android-sdk
          cd /tmp/android-sdk
          
          curl -sSL https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -o cmdline.zip
          unzip -q cmdline.zip
          mkdir -p cmdline-tools/latest
          mv cmdline-tools/bin cmdline-tools/lib cmdline-tools/source.properties cmdline-tools/latest/ 2>/dev/null || true
          
          export PATH="/tmp/android-sdk/cmdline-tools/latest/bin:$PATH"
          export ANDROID_SDK_ROOT="/tmp/android-sdk"
          
          yes | sdkmanager --sdk_root="/tmp/android-sdk" --licenses || true
          sdkmanager --sdk_root="/tmp/android-sdk" "platform-tools"
          sdkmanager --sdk_root="/tmp/android-sdk" "platforms;android-31"
          sdkmanager --sdk_root="/tmp/android-sdk" "build-tools;33.0.2"
          sdkmanager --sdk_root="/tmp/android-sdk" "ndk;25.1.8937393"

      - name: Verify source files
        run: |
          echo "=== Checking app structure ==="
          ls -la app/
          ls -la app/tabs/
          echo "=== Checking key files ==="
          head -5 app/main_app.py
          head -5 app/tabs/watchlist.py

      - name: Run Buildozer (Clean Build)
        env:
          ANDROID_SDK_ROOT: /tmp/android-sdk
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          set -o pipefail
          echo "=== Starting CLEAN build ==="
          buildozer android clean
          buildozer android debug 2>&1 | tee build_logs/buildozer.log
          echo "=== Build completed ==="

      - name: Verify APK
        run: |
          echo "=== Looking for APK ==="
          find . -name "*.apk" -type f
          ls -lh bin/*.apk 2>/dev/null || echo "APK not in bin/"

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            bin/*.apk
            bin/*.aab
          if-no-files-found: warn

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build_logs/
          if-no-files-found: warn

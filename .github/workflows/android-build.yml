name: Android Debug Build

on:
  workflow_dispatch: {}
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git openjdk-11-jdk build-essential autoconf libtool pkg-config zlib1g-dev libssl-dev libncurses5-dev libsqlite3-dev libffi-dev python3-venv python3-dev python3-pip

      - name: Setup Python venv
        run: |
          python3 -m venv .build-env
          source .build-env/bin/activate
          pip install --upgrade pip
          pip install cython==0.29.* buildozer

      - name: Build APK (debug)
        env:
          JAVA_HOME: /usr/lib/jvm/java-11-openjdk-amd64
        run: |
          source .build-env/bin/activate
          # ensure buildozer uses the repo root
          buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: bin/*.apk

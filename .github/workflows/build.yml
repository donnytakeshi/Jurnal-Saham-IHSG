name: Build Kivy APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          python-version: '3.10'
        # fix yaml env
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            openjdk-17-jdk unzip wget build-essential autoconf autoconf-archive automake \
            libtool libtool-bin autotools-dev m4 pkg-config \
            zlib1g-dev libncurses5-dev libffi-dev libssl-dev \
            libbz2-dev libreadline-dev libsqlite3-dev libgdbm-dev liblzma-dev \
            ca-certificates git
          python -m pip install --upgrade pip
          pip install --upgrade buildozer python-for-android cython
      - name: Init submodules
        run: git submodule update --init --recursive
      - name: Build APK
        run: buildozer android debug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kivy-apk
          path: bin/*.apk
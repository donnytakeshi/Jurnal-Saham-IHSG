<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuantFlow - Jurnal Saham IHSG</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Work+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect fill='%2367d9cb' width='16' height='16'/></svg>">
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary": "#ffb59b",
                        "surface-container-high": "#252b2a",
                        "on-tertiary": "#5a1b01",
                        "inverse-on-surface": "#2c3230",
                        "on-background": "#dee4e1",
                        "error-container": "#93000a",
                        "surface-container": "#1b2120",
                        "surface-container-low": "#171d1c",
                        "secondary": "#67d9cb",
                        "on-tertiary-fixed-variant": "#783114",
                        "on-secondary-fixed-variant": "#005049",
                        "on-primary-fixed-variant": "#005049",
                        "surface-container-lowest": "#0a0f0e",
                        "on-primary": "#003732",
                        "secondary-container": "#20a195",
                        "on-error": "#690005",
                        "secondary-fixed": "#85f5e7",
                        "background": "#0f1413",
                        "primary-fixed-dim": "#67d9cb",
                        "surface-tint": "#67d9cb",
                        "tertiary-fixed-dim": "#ffb59b",
                        "secondary-fixed-dim": "#67d9cb",
                        "on-error-container": "#ffdad6",
                        "outline": "#869391",
                        "on-secondary-fixed": "#00201d",
                        "inverse-primary": "#006a62",
                        "surface-container-highest": "#303635",
                        "on-surface-variant": "#bcc9c6",
                        "surface-variant": "#303635",
                        "on-secondary-container": "#00302b",
                        "primary-container": "#1fa195",
                        "inverse-surface": "#dee4e1",
                        "on-primary-fixed": "#00201d",
                        "on-primary-container": "#00302b",
                        "on-secondary": "#003732",
                        "on-tertiary-container": "#501600",
                        "tertiary-container": "#d47856",
                        "surface-dim": "#0f1413",
                        "on-surface": "#dee4e1",
                        "outline-variant": "#3d4947",
                        "on-tertiary-fixed": "#380d00",
                        "primary-fixed": "#84f5e7",
                        "error": "#ffb4ab",
                        "tertiary-fixed": "#ffdbcf",
                        "surface-bright": "#353a39",
                        "primary": "#67d9cb",
                        "surface": "#0f1413"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "margin": "20px",
                        "gutter": "16px",
                        "base": "4px",
                        "xl": "32px",
                        "sm": "8px",
                        "md": "16px",
                        "lg": "24px",
                        "xs": "4px"
                    },
                    "fontFamily": {
                        "label-md": ["Inter"],
                        "body-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-lg": ["Work Sans"],
                        "headline-md": ["Work Sans"],
                        "numeric-data": ["Inter"]
                    }
                }
            }
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .custom-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .custom-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .glass-card {
            background: rgba(24, 28, 33, 0.7);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .pulsing-dot {
            box-shadow: 0 0 0 0 rgba(103, 217, 203, 0.7);
            animation: pulse-green 2s infinite;
        }
        @keyframes pulse-green {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(103, 217, 203, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(103, 217, 203, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(103, 217, 203, 0.7); }
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .tab-btn.active-nav { color: #67d9cb; border-top: 3px solid #67d9cb; }
    </style>
</head>
<body class="bg-[#101419] text-on-background font-body-md selection:bg-primary/30">

<!-- TAB: HOME -->
<div id="tab-home" class="tab-content active"></div>

<!-- TAB: WATCHLIST -->
<div id="tab-watchlist" class="tab-content"></div>

<!-- TAB: JOURNAL -->
<div id="tab-journal" class="tab-content"></div>

<!-- TAB: SCREENING -->
<div id="tab-screening" class="tab-content"></div>

<!-- TAB: CEK SAHAM -->
<div id="tab-cek_saham" class="tab-content"></div>

<!-- TAB: AI CHAT -->
<div id="tab-aichat" class="tab-content"></div>

<!-- Bottom Navigation -->
<nav class="fixed bottom-0 left-0 right-0 bg-[#101419] border-t border-white/10">
    <div class="flex items-center justify-around max-w-2xl mx-auto">
        <button onclick="switchTab('tab-home')" class="tab-btn flex-1 flex flex-col items-center gap-1 py-4 text-on-surface-variant hover:text-primary active-nav" data-tab="tab-home">
            <span class="material-symbols-outlined">home</span>
            <span class="font-label-md text-label-md">HOME</span>
        </button>
        <button onclick="switchTab('tab-watchlist')" class="tab-btn flex-1 flex flex-col items-center gap-1 py-4 text-on-surface-variant hover:text-primary" data-tab="tab-watchlist">
            <span class="material-symbols-outlined">trending_up</span>
            <span class="font-label-md text-label-md">WATCHLIST</span>
        </button>
        <button onclick="switchTab('tab-journal')" class="tab-btn flex-1 flex flex-col items-center gap-1 py-4 text-on-surface-variant hover:text-primary" data-tab="tab-journal">
            <span class="material-symbols-outlined">article</span>
            <span class="font-label-md text-label-md">JOURNAL</span>
        </button>
        <button onclick="switchTab('tab-screening')" class="tab-btn flex-1 flex flex-col items-center gap-1 py-4 text-on-surface-variant hover:text-primary" data-tab="tab-screening">
            <span class="material-symbols-outlined">tune</span>
            <span class="font-label-md text-label-md">SCREENING</span>
        </button>
        <button onclick="switchTab('tab-cek_saham')" class="tab-btn flex-1 flex flex-col items-center gap-1 py-4 text-on-surface-variant hover:text-primary" data-tab="tab-cek_saham">
            <span class="material-symbols-outlined">analytics</span>
            <span class="font-label-md text-label-md">CEK SAHAM</span>
        </button>
        <button onclick="switchTab('tab-aichat')" class="tab-btn flex-1 flex flex-col items-center gap-1 py-4 text-on-surface-variant hover:text-primary" data-tab="tab-aichat">
            <span class="material-symbols-outlined">smart_toy</span>
            <span class="font-label-md text-label-md">AI CHAT</span>
        </button>
    </div>
</nav>

<!-- Load Component Scripts -->
<script src="components/home.js"></script>
<script src="components/watchlist.js"></script>
<script src="components/journal.js"></script>
<script src="components/screening.js"></script>
<script src="components/cek_saham.js"></script>
<script src="components/aichat.js"></script>

<script>
    // Tab switching function
    function switchTab(tabId) {
        const tabs = document.querySelectorAll('.tab-content');
        tabs.forEach(tab => tab.classList.remove('active'));
        
        document.getElementById(tabId).classList.add('active');
        
        const buttons = document.querySelectorAll('.tab-btn');
        buttons.forEach(btn => btn.classList.remove('active-nav', 'text-primary'));
        
        const activeBtn = document.querySelector(`[data-tab="${tabId}"]`);
        if (activeBtn) {
            activeBtn.classList.add('active-nav', 'text-primary');
        }
    }

    // Initialize tabs on page load
    window.addEventListener('load', function() {
        renderAllTabs();
    });

    // Render all tab contents
    function renderAllTabs() {
        document.getElementById('tab-home').innerHTML = renderHome();
        document.getElementById('tab-watchlist').innerHTML = renderWatchlist();
        document.getElementById('tab-journal').innerHTML = renderJournal();
        document.getElementById('tab-screening').innerHTML = renderScreening();
        document.getElementById('tab-cek_saham').innerHTML = renderCekSaham();
        document.getElementById('tab-aichat').innerHTML = renderAiChat();
    }
</script>

</body>
</html>

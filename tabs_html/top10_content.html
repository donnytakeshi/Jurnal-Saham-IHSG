<!DOCTYPE html>
<html class="dark">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0c141b; font-family: 'Inter', sans-serif; padding: 16px; margin: 0; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .positive { color: #67d9cb; }
        .negative { color: #ff5e5e; }
        .card {
            background: #181c21;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #2a2a2a;
        }
        .section-title { font-weight: 600; font-size: 14px; letter-spacing: 0.5px; }
        .badge { font-size: 10px; padding: 2px 8px; border-radius: 20px; font-weight: 600; }
        .badge-bullish { background: #67d9cb20; color: #67d9cb; }
        .badge-bearish { background: #ff5e5e20; color: #ff5e5e; }
        .stock-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #2a2a2a;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        .stock-row:hover {
            background: #2a2a2a;
            border-radius: 8px;
            padding-left: 8px;
            padding-right: 8px;
        }
        .stock-row:last-child { border-bottom: none; }
        .stock-code { font-weight: 700; color: white; font-size: 14px; }
        .stock-name { font-size: 10px; color: #6b7280; margin-top: 2px; }
        .price { font-weight: 600; color: white; font-size: 13px; }
        .change { font-size: 11px; font-weight: 600; margin-top: 2px; }
        .status-badge { font-size: 11px; background: #2a2a2a; border-radius: 20px; padding: 4px 12px; display: inline-block; }
        .status-badge.online { background: #67d9cb20; color: #67d9cb; }
        .status-badge.offline { background: #ff5e5e20; color: #ff5e5e; }
        .last-update { font-size: 10px; color: #6b7280; text-align: center; margin-top: 8px; }
        .sentiment-bar {
            height: 4px;
            background: #2a2a2a;
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            margin: 12px 0;
        }
        .sentiment-bar-adv { background: #67d9cb; height: 100%; }
        .sentiment-bar-dec { background: #ff5e5e; height: 100%; }
        .sector-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }
        .sector-item {
            background: #1a2027;
            border-radius: 12px;
            padding: 12px;
            text-align: center;
        }
        .sector-name { font-size: 10px; color: #6b7280; text-transform: uppercase; }
        .sector-value { font-size: 14px; font-weight: 600; margin-top: 4px; }
        .two-columns { display: block; }
    </style>
</head>
<body>

<!-- Header Card -->
<div class="card">
    <div class="flex justify-between items-center">
        <div>
            <div class="text-white text-lg font-bold">Top 10 IHSG</div>
            <div class="text-xs text-slate-500">Klik kode saham untuk analisis detail</div>
        </div>
        <div class="flex items-center gap-3">
            <div class="flex items-center gap-2">
                <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
                <span class="text-xs text-slate-400">Live</span>
            </div>
            <span id="api-status" class="status-badge online">Memeriksa...</span>
        </div>
    </div>
</div>

<!-- Top Gainers Card -->
<div class="card">
    <div class="card-header">
        <div class="section-title text-green-400">Top Gainers</div>
        <span class="badge badge-bullish">BULLISH</span>
    </div>
    <div id="gainers-list"></div>
</div>

<!-- Top Losers Card -->
<div class="card">
    <div class="card-header">
        <div class="section-title text-red-400">Top Losers</div>
        <span class="badge badge-bearish">BEARISH</span>
    </div>
    <div id="losers-list"></div>
</div>

<!-- Market Sentiment Card -->
<div class="card">
    <div class="flex justify-between items-center mb-3">
        <div class="section-title text-white">Volatility Pulse</div>
        <span id="vix-value" class="text-xs text-slate-400">Adv/Dec: --</span>
    </div>
    <div class="sentiment-bar">
        <div id="advancing-bar" class="sentiment-bar-adv" style="width: 0%;"></div>
        <div id="declining-bar" class="sentiment-bar-dec" style="width: 0%;"></div>
    </div>
    <div class="flex justify-between text-xs">
        <span id="advancing-pct" class="text-green-400">0% Advancing</span>
        <span id="declining-pct" class="text-red-400">0% Declining</span>
    </div>
</div>

<!-- Sector Performance Card -->
<div class="card">
    <div class="section-title text-white mb-3">Sector Performance</div>
    <div class="sector-grid">
        <div class="sector-item"><div class="sector-name">Tech</div><div id="sector-tech" class="sector-value">--</div></div>
        <div class="sector-item"><div class="sector-name">Energy</div><div id="sector-energy" class="sector-value">--</div></div>
        <div class="sector-item"><div class="sector-name">Health</div><div id="sector-health" class="sector-value">--</div></div>
        <div class="sector-item"><div class="sector-name">Finance</div><div id="sector-finance" class="sector-value">--</div></div>
    </div>
</div>

<div id="last-update" class="last-update">--</div>

<script>
    const API_URL = 'https://ihsg-api-cphs.onrender.com';
    
    const sectorStocks = {
        tech: ["TLKM", "GOTO", "ERAA", "TOWR"],
        energy: ["ADRO", "MEDC", "PGAS", "HRUM", "MDKA"],
        health: ["SIDO", "JPFA", "CPIN", "ICBP", "INDF"],
        finance: ["BBCA", "BBRI", "BMRI", "BRIS", "BBNI"]
    };
    
    const allStocks = [
        "BBCA", "BBRI", "BMRI", "TLKM", "ASII", "GOTO", "UNVR", "ADRO",
        "CPIN", "ICBP", "INDF", "MEDC", "PGAS", "SMGR", "ANTM",
        "SIDO", "JPFA", "MDKA", "INKP", "TKIM", "HRUM", "TOWR", "ERAA"
    ];
    
    let allQuotes = [];
    let gainerRows = [];
    let loserRows = [];
    let gainersListElem = null;
    let losersListElem = null;
    
    function openStockInCekEmiten(stockCode) {
        if (window.parent) window.parent.postMessage({ type: 'OPEN_STOCK', stockCode }, '*');
        else alert(`Buka ${stockCode} di Cek Emiten`);
    }
    
    async function fetchQuote(symbol) {
        try {
            const res = await fetch(`${API_URL}/quote?symbol=${symbol}`);
            if (!res.ok) return null;
            const data = await res.json();
            return { code: symbol, price: data.price, changePercent: data.changePercent };
        } catch (e) {
            return null;
        }
    }
    
    async function fetchAllQuotes() {
        const results = await Promise.all(allStocks.map(s => fetchQuote(s)));
        allQuotes = results.filter(q => q !== null && q.price > 0);
        return allQuotes;
    }
    
    function getTopGainers() {
        return [...allQuotes].filter(q => q.changePercent > 0).sort((a,b) => b.changePercent - a.changePercent).slice(0,10);
    }
    function getTopLosers() {
        return [...allQuotes].filter(q => q.changePercent < 0).sort((a,b) => a.changePercent - b.changePercent).slice(0,10);
    }
    
    function getSectorPerformance() {
        const sectorChanges = {};
        for (const [sector, stocks] of Object.entries(sectorStocks)) {
            let sum = 0, count = 0;
            for (const code of stocks) {
                const quote = allQuotes.find(q => q.code === code);
                if (quote && quote.changePercent !== undefined) {
                    sum += quote.changePercent;
                    count++;
                }
            }
            sectorChanges[sector] = count > 0 ? sum / count : 0;
        }
        return sectorChanges;
    }
    
    function formatNumber(n) { return n ? n.toLocaleString('id-ID') : '---'; }
    
    function getStockName(code) {
        const names = {
            "BBCA":"Bank Central Asia","BBRI":"Bank Rakyat Indonesia","BMRI":"Bank Mandiri",
            "TLKM":"Telkom Indonesia","ASII":"Astra International","GOTO":"GoTo",
            "UNVR":"Unilever Indonesia","ADRO":"Adaro Energy","CPIN":"Charoen Pokphand",
            "ICBP":"Indofood CBP","INDF":"Indofood","MEDC":"Medco Energi","PGAS":"PGAS",
            "SMGR":"Semen Indonesia","ANTM":"Aneka Tambang","SIDO":"Sido Muncul",
            "JPFA":"Japfa Comfeed","MDKA":"Merdeka Copper","INKP":"Indah Kiat Pulp",
            "TKIM":"Tjiwi Kimia","HRUM":"Harum Energy","TOWR":"Sarana Menara","ERAA":"Erajaya"
        };
        return names[code] || code;
    }
    
    function buildInitialTable() {
        gainersListElem = document.getElementById('gainers-list');
        losersListElem = document.getElementById('losers-list');
        gainersListElem.innerHTML = '';
        losersListElem.innerHTML = '';
        gainerRows = [];
        loserRows = [];
        
        for (let i = 0; i < 10; i++) {
            const row = document.createElement('div');
            row.className = 'stock-row';
            row.innerHTML = `
                <div>
                    <div class="stock-code">---</div>
                    <div class="stock-name">---</div>
                </div>
                <div class="text-right">
                    <div class="price">---</div>
                    <div class="change">---</div>
                </div>
            `;
            gainersListElem.appendChild(row);
            gainerRows.push(row);
        }
        for (let i = 0; i < 10; i++) {
            const row = document.createElement('div');
            row.className = 'stock-row';
            row.innerHTML = `
                <div>
                    <div class="stock-code">---</div>
                    <div class="stock-name">---</div>
                </div>
                <div class="text-right">
                    <div class="price">---</div>
                    <div class="change">---</div>
                </div>
            `;
            losersListElem.appendChild(row);
            loserRows.push(row);
        }
    }
    
    async function updateTop10Data() {
        const statusSpan = document.getElementById('api-status');
        try {
            await fetchAllQuotes();
            if (!allQuotes.length) throw new Error("Tidak ada data");
            
            const gainers = getTopGainers();
            const losers = getTopLosers();
            
            // Update gainers
            for (let i = 0; i < gainerRows.length; i++) {
                const stock = gainers[i];
                const row = gainerRows[i];
                if (stock) {
                    const codeDiv = row.querySelector('.stock-code');
                    const nameDiv = row.querySelector('.stock-name');
                    const priceDiv = row.querySelector('.price');
                    const changeDiv = row.querySelector('.change');
                    codeDiv.textContent = stock.code;
                    nameDiv.textContent = getStockName(stock.code);
                    priceDiv.textContent = formatNumber(stock.price);
                    const changeVal = stock.changePercent;
                    const changeSign = changeVal >= 0 ? '+' : '';
                    changeDiv.textContent = `${changeSign}${changeVal.toFixed(2)}%`;
                    changeDiv.className = `change ${changeVal >= 0 ? 'positive' : 'negative'}`;
                    if (!row.hasAttribute('data-listener')) {
                        row.addEventListener('click', () => openStockInCekEmiten(stock.code));
                        row.setAttribute('data-listener', 'true');
                    }
                } else {
                    row.querySelector('.stock-code').textContent = '---';
                    row.querySelector('.stock-name').textContent = '---';
                    row.querySelector('.price').textContent = '---';
                    row.querySelector('.change').textContent = '---';
                }
            }
            // Update losers
            for (let i = 0; i < loserRows.length; i++) {
                const stock = losers[i];
                const row = loserRows[i];
                if (stock) {
                    const codeDiv = row.querySelector('.stock-code');
                    const nameDiv = row.querySelector('.stock-name');
                    const priceDiv = row.querySelector('.price');
                    const changeDiv = row.querySelector('.change');
                    codeDiv.textContent = stock.code;
                    nameDiv.textContent = getStockName(stock.code);
                    priceDiv.textContent = formatNumber(stock.price);
                    const changeVal = stock.changePercent;
                    const changeSign = changeVal >= 0 ? '+' : '';
                    changeDiv.textContent = `${changeSign}${changeVal.toFixed(2)}%`;
                    changeDiv.className = `change ${changeVal >= 0 ? 'positive' : 'negative'}`;
                    if (!row.hasAttribute('data-listener')) {
                        row.addEventListener('click', () => openStockInCekEmiten(stock.code));
                        row.setAttribute('data-listener', 'true');
                    }
                } else {
                    row.querySelector('.stock-code').textContent = '---';
                    row.querySelector('.stock-name').textContent = '---';
                    row.querySelector('.price').textContent = '---';
                    row.querySelector('.change').textContent = '---';
                }
            }
            
            const total = gainers.length + losers.length;
            const advPct = total ? (gainers.length / total) * 100 : 0;
            const decPct = total ? (losers.length / total) * 100 : 0;
            document.getElementById('advancing-bar').style.width = `${advPct}%`;
            document.getElementById('declining-bar').style.width = `${decPct}%`;
            document.getElementById('advancing-pct').innerHTML = `${Math.round(advPct)}% Advancing`;
            document.getElementById('declining-pct').innerHTML = `${Math.round(decPct)}% Declining`;
            document.getElementById('vix-value').innerHTML = `Adv/Dec: ${gainers.length}/${losers.length}`;
            
            const sectorPerf = getSectorPerformance();
            const formatSector = (val) => `${val > 0 ? '+' : ''}${val.toFixed(1)}%`;
            const secTech = document.getElementById('sector-tech');
            secTech.innerHTML = formatSector(sectorPerf.tech || 0);
            secTech.className = `sector-value ${(sectorPerf.tech || 0) >= 0 ? 'text-green-400' : 'text-red-400'}`;
            const secEnergy = document.getElementById('sector-energy');
            secEnergy.innerHTML = formatSector(sectorPerf.energy || 0);
            secEnergy.className = `sector-value ${(sectorPerf.energy || 0) >= 0 ? 'text-green-400' : 'text-red-400'}`;
            const secHealth = document.getElementById('sector-health');
            secHealth.innerHTML = formatSector(sectorPerf.health || 0);
            secHealth.className = `sector-value ${(sectorPerf.health || 0) >= 0 ? 'text-green-400' : 'text-red-400'}`;
            const secFinance = document.getElementById('sector-finance');
            secFinance.innerHTML = formatSector(sectorPerf.finance || 0);
            secFinance.className = `sector-value ${(sectorPerf.finance || 0) >= 0 ? 'text-green-400' : 'text-red-400'}`;
            
            document.getElementById('last-update').innerHTML = `Last update: ${new Date().toLocaleTimeString('id-ID')}`;
            statusSpan.textContent = `Connected (${allQuotes.length})`;
            statusSpan.className = "status-badge online";
        } catch (err) {
            statusSpan.textContent = "Cek API";
            statusSpan.className = "status-badge offline";
        }
    }
    
    buildInitialTable();
    updateTop10Data();
    setInterval(updateTop10Data, 30000);
</script>
</body>
</html>

<!DOCTYPE html>
<html class="dark">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0c141b; font-family: 'Inter', sans-serif; padding: 16px; margin: 0; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .positive { color: #67d9cb; }
        .negative { color: #ff5e5e; }
        
        .card {
            background: #181c21;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }
        
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #2a2a2a;
        }
        
        .section-title { font-weight: 600; font-size: 14px; letter-spacing: 0.5px; }
        .badge { font-size: 10px; padding: 2px 8px; border-radius: 20px; font-weight: 600; }
        .badge-bullish { background: #67d9cb20; color: #67d9cb; }
        .badge-bearish { background: #ff5e5e20; color: #ff5e5e; }
        
        .stock-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #2a2a2a;
        }
        .stock-row:last-child { border-bottom: none; }
        
        .stock-code { font-weight: 700; color: white; font-size: 14px; }
        .stock-name { font-size: 10px; color: #6b7280; margin-top: 2px; }
        .price { font-weight: 600; color: white; font-size: 13px; }
        .change { font-size: 11px; font-weight: 600; margin-top: 2px; }
        
        .status-badge { font-size: 11px; background: #2a2a2a; border-radius: 20px; padding: 4px 12px; display: inline-block; }
        .status-badge.online { background: #67d9cb20; color: #67d9cb; }
        
        .last-update { font-size: 10px; color: #6b7280; text-align: center; margin-top: 8px; }
        
        .sentiment-bar {
            height: 4px;
            background: #2a2a2a;
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            margin: 12px 0;
        }
        .sentiment-bar-adv { background: #67d9cb; height: 100%; }
        .sentiment-bar-dec { background: #ff5e5e; height: 100%; }
        
        .sector-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }
        .sector-item {
            background: #1a2027;
            border-radius: 12px;
            padding: 12px;
            text-align: center;
        }
        .sector-name { font-size: 10px; color: #6b7280; text-transform: uppercase; }
        .sector-value { font-size: 14px; font-weight: 600; margin-top: 4px; }
        
        /* Hanya 1 kolom untuk mobile */
        .two-columns { display: block; }
    </style>
</head>
<body>

<!-- Header Card -->
<div class="card">
    <div class="flex justify-between items-center">
        <div>
            <div class="text-white text-lg font-bold">Top 10 IHSG</div>
            <div class="text-xs text-slate-500">Market Volatility Snapshot</div>
        </div>
        <div class="flex items-center gap-3">
            <div class="flex items-center gap-2">
                <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
                <span class="text-xs text-slate-400">Live</span>
            </div>
            <span id="api-status" class="status-badge online">Connected</span>
        </div>
    </div>
</div>

<!-- Top Gainers Card (atas) -->
<div class="card">
    <div class="card-header">
        <div class="section-title text-green-400">Top Gainers</div>
        <span class="badge badge-bullish">BULLISH</span>
    </div>
    <div id="gainers-list">
        <div class="stock-row"><div class="text-slate-500 text-center w-full">Loading...</div></div>
    </div>
</div>

<!-- Top Losers Card (bawah) -->
<div class="card">
    <div class="card-header">
        <div class="section-title text-red-400">Top Losers</div>
        <span class="badge badge-bearish">BEARISH</span>
    </div>
    <div id="losers-list">
        <div class="stock-row"><div class="text-slate-500 text-center w-full">Loading...</div></div>
    </div>
</div>

<!-- Market Sentiment Card -->
<div class="card">
    <div class="flex justify-between items-center mb-3">
        <div class="section-title text-white">Volatility Pulse</div>
        <span id="vix-value" class="text-xs text-slate-400">Adv/Dec: --</span>
    </div>
    <div class="sentiment-bar">
        <div id="advancing-bar" class="sentiment-bar-adv" style="width: 0%;"></div>
        <div id="declining-bar" class="sentiment-bar-dec" style="width: 0%;"></div>
    </div>
    <div class="flex justify-between text-xs">
        <span id="advancing-pct" class="text-green-400">0% Advancing</span>
        <span id="declining-pct" class="text-red-400">0% Declining</span>
    </div>
</div>

<!-- Sector Performance Card -->
<div class="card">
    <div class="section-title text-white mb-3">Sector Performance</div>
    <div class="sector-grid">
        <div class="sector-item">
            <div class="sector-name">Tech</div>
            <div id="sector-tech" class="sector-value text-green-400">--</div>
        </div>
        <div class="sector-item">
            <div class="sector-name">Energy</div>
            <div id="sector-energy" class="sector-value text-red-400">--</div>
        </div>
        <div class="sector-item">
            <div class="sector-name">Health</div>
            <div id="sector-health" class="sector-value text-green-400">--</div>
        </div>
        <div class="sector-item">
            <div class="sector-name">Finance</div>
            <div id="sector-finance" class="sector-value text-red-400">--</div>
        </div>
    </div>
</div>

<div id="last-update" class="last-update">--</div>

<script>
    const API_URL = 'http://localhost:5001';
    
    const sectorStocks = {
        tech: ["TLKM", "GOTO", "ERAA", "TOWR"],
        energy: ["ADRO", "MEDC", "PGAS", "HRUM", "MDKA"],
        health: ["SIDO", "JPFA", "CPIN", "ICBP", "INDF"],
        finance: ["BBCA", "BBRI", "BMRI", "BRIS", "BBNI"]
    };
    
    const allStocks = [
        "BBCA", "BBRI", "BMRI", "TLKM", "ASII", "GOTO", "UNVR", "ADRO",
        "CPIN", "ICBP", "INDF", "MEDC", "PGAS", "SMGR", "ANTM",
        "SIDO", "JPFA", "MDKA", "INKP", "TKIM", "HRUM", "TOWR", "ERAA"
    ];
    
    let allQuotes = [];
    
    async function fetchQuote(symbol) {
        try {
            const res = await fetch(`${API_URL}/quote?symbol=${symbol}`);
            if (!res.ok) return null;
            const data = await res.json();
            return { code: symbol, price: data.price, changePercent: data.changePercent };
        } catch (e) {
            return null;
        }
    }
    
    async function fetchAllQuotes() {
        const promises = allStocks.map(s => fetchQuote(s));
        const results = await Promise.all(promises);
        allQuotes = results.filter(q => q !== null && q.price);
    }
    
    function getTopGainers() {
        return [...allQuotes]
            .filter(q => q.changePercent > 0)
            .sort((a, b) => b.changePercent - a.changePercent)
            .slice(0, 5);
    }
    
    function getTopLosers() {
        return [...allQuotes]
            .filter(q => q.changePercent < 0)
            .sort((a, b) => a.changePercent - b.changePercent)
            .slice(0, 5);
    }
    
    function getSectorPerformance() {
        const sectorChanges = {};
        for (const [sector, stocks] of Object.entries(sectorStocks)) {
            let sum = 0, count = 0;
            for (const code of stocks) {
                const quote = allQuotes.find(q => q.code === code);
                if (quote && quote.changePercent !== undefined) {
                    sum += quote.changePercent;
                    count++;
                }
            }
            sectorChanges[sector] = count > 0 ? sum / count : 0;
        }
        return sectorChanges;
    }
    
    function formatNumber(num) {
        if (!num) return '---';
        return num.toLocaleString('id-ID', { maximumFractionDigits: 0 });
    }
    
    function formatChange(change) {
        if (change === undefined) return '---';
        const sign = change > 0 ? '+' : '';
        return `${sign}${change.toFixed(2)}%`;
    }
    
    function getStockName(code) {
        const names = {
            "BBCA": "Bank Central Asia", "BBRI": "Bank Rakyat Indonesia", "BMRI": "Bank Mandiri",
            "TLKM": "Telkom Indonesia", "ASII": "Astra International", "GOTO": "GoTo",
            "UNVR": "Unilever Indonesia", "ADRO": "Adaro Energy", "CPIN": "Charoen Pokphand",
            "ICBP": "Indofood CBP", "INDF": "Indofood", "MEDC": "Medco Energi",
            "PGAS": "PGAS", "SMGR": "Semen Indonesia", "ANTM": "Aneka Tambang",
            "SIDO": "Sido Muncul", "JPFA": "Japfa Comfeed", "MDKA": "Merdeka Copper",
            "INKP": "Indah Kiat Pulp", "TKIM": "Tjiwi Kimia", "HRUM": "Harum Energy",
            "TOWR": "Sarana Menara", "ERAA": "Erajaya"
        };
        return names[code] || code;
    }
    
    function renderStockRow(stock, isGainer) {
        const changeClass = isGainer ? 'positive' : 'negative';
        const changeSign = stock.changePercent > 0 ? '+' : '';
        return `
            <div class="stock-row">
                <div>
                    <div class="stock-code">${stock.code}</div>
                    <div class="stock-name">${getStockName(stock.code)}</div>
                </div>
                <div class="text-right">
                    <div class="price">${formatNumber(stock.price)}</div>
                    <div class="change ${changeClass}">${changeSign}${stock.changePercent.toFixed(2)}%</div>
                </div>
            </div>
        `;
    }
    
    async function renderTop10() {
        await fetchAllQuotes();
        
        const gainers = getTopGainers();
        const losers = getTopLosers();
        
        const gainersDiv = document.getElementById('gainers-list');
        const losersDiv = document.getElementById('losers-list');
        
        if (gainers.length === 0) {
            gainersDiv.innerHTML = '<div class="stock-row"><div class="text-slate-500 text-center w-full">No gainers</div></div>';
        } else {
            gainersDiv.innerHTML = gainers.map(s => renderStockRow(s, true)).join('');
        }
        
        if (losers.length === 0) {
            losersDiv.innerHTML = '<div class="stock-row"><div class="text-slate-500 text-center w-full">No losers</div></div>';
        } else {
            losersDiv.innerHTML = losers.map(s => renderStockRow(s, false)).join('');
        }
        
        const total = gainers.length + losers.length;
        const advancingPct = total > 0 ? (gainers.length / total) * 100 : 0;
        const decliningPct = total > 0 ? (losers.length / total) * 100 : 0;
        
        document.getElementById('advancing-bar').style.width = `${advancingPct}%`;
        document.getElementById('declining-bar').style.width = `${decliningPct}%`;
        document.getElementById('advancing-pct').innerHTML = `${Math.round(advancingPct)}% Advancing`;
        document.getElementById('declining-pct').innerHTML = `${Math.round(decliningPct)}% Declining`;
        document.getElementById('vix-value').innerHTML = `Adv/Dec: ${gainers.length}/${losers.length}`;
        
        const sectorPerf = getSectorPerformance();
        const formatSector = (val) => {
            const sign = val > 0 ? '+' : '';
            return `${sign}${val.toFixed(1)}%`;
        };
        document.getElementById('sector-tech').innerHTML = formatSector(sectorPerf.tech || 0);
        document.getElementById('sector-tech').className = `sector-value ${(sectorPerf.tech || 0) >= 0 ? 'text-green-400' : 'text-red-400'}`;
        document.getElementById('sector-energy').innerHTML = formatSector(sectorPerf.energy || 0);
        document.getElementById('sector-energy').className = `sector-value ${(sectorPerf.energy || 0) >= 0 ? 'text-green-400' : 'text-red-400'}`;
        document.getElementById('sector-health').innerHTML = formatSector(sectorPerf.health || 0);
        document.getElementById('sector-health').className = `sector-value ${(sectorPerf.health || 0) >= 0 ? 'text-green-400' : 'text-red-400'}`;
        document.getElementById('sector-finance').innerHTML = formatSector(sectorPerf.finance || 0);
        document.getElementById('sector-finance').className = `sector-value ${(sectorPerf.finance || 0) >= 0 ? 'text-green-400' : 'text-red-400'}`;
        
        document.getElementById('last-update').innerHTML = `Last update: ${new Date().toLocaleTimeString('id-ID')}`;
        document.getElementById('api-status').innerHTML = `Connected (${allQuotes.length})`;
    }
    
    renderTop10();
    setInterval(renderTop10, 15000);
</script>
</body>
</html>

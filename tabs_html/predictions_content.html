<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <style>
        body { background: #0c141b; font-family: 'Inter', sans-serif; padding: 16px; margin: 0; }
        .card {
            background: #181c21;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 16px;
            margin-bottom: 16px;
        }
        .stock-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .stock-row:last-child { border-bottom: none; }
        .positive { color: #67d9cb !important; }
        .negative { color: #ff5e5e !important; }
        .potential-high { color: #f2d18f !important; font-weight: bold; }
        .badge-buy { background: #67d9cb20; color: #67d9cb; border-radius: 20px; padding: 2px 10px; font-size: 10px; display: inline-block; }
        .badge-hold { background: #8b919b20; color: #8b919b; border-radius: 20px; padding: 2px 10px; font-size: 10px; display: inline-block; }
        .refresh-btn {
            background: #1a2027;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 6px 14px;
            color: #8b919b;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .refresh-btn:hover { background: #252a33; color: #159D91; }
        .section-title { font-size: 14px; font-weight: 600; color: white; margin: 0; }
        .text-white { color: white !important; }
        .text-slate-500 { color: #8b919b !important; }
    </style>
</head>
<body>

<div class="card">
    <div class="flex justify-between items-center">
        <div>
            <div class="section-title">Prediksi Saham</div>
            <p class="text-xs text-slate-500 mt-1">Berdasarkan analisis bandarmology & volume real-time</p>
        </div>
        <button id="refreshBtn" class="refresh-btn">
            <span class="material-symbols-outlined text-sm">refresh</span>
            Refresh
        </button>
    </div>
</div>

<div class="card">
    <div id="predictions-list">
        <div class="text-center text-slate-500 py-8">
            <span class="inline-block w-4 h-4 border-2 border-[#159D91] border-t-transparent rounded-full animate-spin mr-2"></span>
            Memuat data prediksi...
        </div>
    </div>
    <div id="last-update" class="text-center text-[10px] text-slate-500 mt-3 pt-2 border-t border-white/5">--</div>
</div>

<script>
    const API_URL = 'http://localhost:5002';
    
    async function loadPredictions() {
        const container = document.getElementById('predictions-list');
        container.innerHTML = '<div class="text-center text-slate-500 py-8"><span class="inline-block w-4 h-4 border-2 border-[#159D91] border-t-transparent rounded-full animate-spin mr-2"></span>Memuat data...</div>';
        
        try {
            const response = await fetch(`${API_URL}/predict`);
            const data = await response.json();
            const predictions = data.predictions || [];
            
            if (predictions.length === 0) {
                container.innerHTML = '<div class="text-center text-slate-500 py-8">Belum ada data prediksi yang cukup</div>';
                return;
            }
            
            let html = '<div style="overflow-x: auto;">';
            html += '<div style="min-width: 550px;">';
            
            for (const p of predictions) {
                const changeClass = p.changePercent >= 0 ? 'positive' : 'negative';
                const changeSign = p.changePercent >= 0 ? '+' : '';
                const potentialClass = p.potentialGain >= 6 ? 'potential-high' : '';
                const recClass = p.recommendation === 'BUY' ? 'badge-buy' : 'badge-hold';
                let signalColor = '#8b919b';
                if (p.signal === 'ACCUMULATION') signalColor = '#67d9cb';
                else if (p.signal === 'BREAKOUT') signalColor = '#f2d18f';
                
                html += `
                    <div class="stock-row">
                        <div style="flex: 1.5;">
                            <div class="font-bold" style="color: white;">${p.symbol}</div>
                            <div class="text-xs" style="color: #8b919b;">${p.name.substring(0, 20)}</div>
                        </div>
                        <div style="text-align: right; flex: 1;">
                            <div class="text-sm font-semibold" style="color: white;">${p.price.toLocaleString('id-ID')}</div>
                            <div class="text-xs ${changeClass}">${changeSign}${p.changePercent.toFixed(2)}%</div>
                        </div>
                        <div style="text-align: center; flex: 1;">
                            <div class="text-sm" style="color: white;">${p.volumeRatio.toFixed(1)}x</div>
                            <div class="text-xs" style="color: #8b919b;">Volume</div>
                        </div>
                        <div style="text-align: center; flex: 1.5;">
                            <div class="text-xs font-semibold" style="color: ${signalColor};">${p.signal}</div>
                            <div class="text-xs ${recClass}" style="margin-top: 4px;">${p.recommendation}</div>
                        </div>
                        <div style="text-align: right; flex: 1;">
                            <div class="text-sm font-semibold ${potentialClass}" style="${p.potentialGain >= 6 ? 'color:#f2d18f;' : 'color:white;'}">+${p.potentialGain}%</div>
                            <div class="text-xs" style="color: #8b919b;">potensi</div>
                        </div>
                    </div>
                `;
            }
            
            html += '</div></div>';
            container.innerHTML = html;
            
            const now = new Date();
            document.getElementById('last-update').innerHTML = `Last update: ${now.toLocaleTimeString('id-ID')}`;
            
        } catch (error) {
            console.error('Error:', error);
            container.innerHTML = '<div class="text-center text-red-400 py-8">⚠️ Gagal memuat data. Pastikan API server berjalan di port 5001</div>';
        }
    }
    
    loadPredictions();
    document.getElementById('refreshBtn').addEventListener('click', loadPredictions);
    setInterval(loadPredictions, 30000);
</script>
</body>
</html>

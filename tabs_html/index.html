<!DOCTYPE html>
<html class="dark">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <style>
        body { font-family: 'Inter', sans-serif; background: #0c141b; margin: 0; padding: 0; }
        iframe { border: none; width: 100%; height: calc(100vh - 120px); }
        .material-symbols-outlined { font-size: 22px; }
        .tab-active { color: #159D91; background-color: rgba(21, 157, 145, 0.1); border-radius: 12px; }
        .tab-inactive { color: #8b919b; }
    </style>
</head>
<body>

<!-- HEADER (sticky) -->
<header style="position: fixed; top: 0; left: 0; width: 100%; z-index: 50; background: #101419; border-bottom: 1px solid #2a2a2a; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center;">
    <div style="display: flex; align-items: center; gap: 12px;">
        <span style="font-weight: bold; font-size: 24px; color: #159D91;">QuantFlow</span>
        <h1 id="page-title" style="font-weight: 600; font-size: 18px; color: white; margin: 0;">Watchlist</h1>
    </div>
    <button id="refresh-btn" style="background: none; border: none; cursor: pointer; color: #8b919b;">
        <span class="material-symbols-outlined" style="font-size: 22px;">refresh</span>
    </button>
</header>

<!-- IFRAME KONTEN -->
<iframe id="content-frame" src="watchlist_content.html" style="margin-top: 65px;"></iframe>

<!-- BOTTOM NAVIGATION (sticky) dengan Material Icons (7 TAB) -->
<nav style="position: fixed; bottom: 0; left: 0; width: 100%; background: #181c21; border-top: 1px solid #2a2a2a; display: flex; justify-content: space-around; padding: 8px 0;">
    
    <a href="#" data-tab="watchlist" class="tab-btn tab-active" style="display: flex; flex-direction: column; align-items: center; padding: 8px 12px; text-decoration: none; gap: 4px;">
        <span class="material-symbols-outlined" style="font-size: 22px;">trending_up</span>
        <span style="font-size: 10px; font-weight: 500;">Watchlist</span>
    </a>
    
    <a href="#" data-tab="top10" class="tab-btn tab-inactive" style="display: flex; flex-direction: column; align-items: center; padding: 8px 12px; text-decoration: none; gap: 4px;">
        <span class="material-symbols-outlined" style="font-size: 22px;">format_list_numbered</span>
        <span style="font-size: 10px; font-weight: 500;">Top 10</span>
    </a>
    
    <a href="#" data-tab="jurnal" class="tab-btn tab-inactive" style="display: flex; flex-direction: column; align-items: center; padding: 8px 12px; text-decoration: none; gap: 4px;">
        <span class="material-symbols-outlined" style="font-size: 22px;">menu_book</span>
        <span style="font-size: 10px; font-weight: 500;">Jurnal</span>
    </a>
    
    <a href="#" data-tab="screening" class="tab-btn tab-inactive" style="display: flex; flex-direction: column; align-items: center; padding: 8px 12px; text-decoration: none; gap: 4px;">
        <span class="material-symbols-outlined" style="font-size: 22px;">search</span>
        <span style="font-size: 10px; font-weight: 500;">Screening</span>
    </a>
    
    <a href="#" data-tab="cek_emiten" class="tab-btn tab-inactive" style="display: flex; flex-direction: column; align-items: center; padding: 8px 12px; text-decoration: none; gap: 4px;">
        <span class="material-symbols-outlined" style="font-size: 22px;">business</span>
        <span style="font-size: 10px; font-weight: 500;">Cek Emiten</span>
    </a>
    
    <a href="#" data-tab="predictions" class="tab-btn tab-inactive" style="display: flex; flex-direction: column; align-items: center; padding: 8px 12px; text-decoration: none; gap: 4px;">
        <span class="material-symbols-outlined" style="font-size: 22px;">insights</span>
        <span style="font-size: 10px; font-weight: 500;">Prediksi</span>
    </a>
    
    <a href="#" data-tab="ai_chat" class="tab-btn tab-inactive" style="display: flex; flex-direction: column; align-items: center; padding: 8px 12px; text-decoration: none; gap: 4px;">
        <span class="material-symbols-outlined" style="font-size: 22px;">smart_toy</span>
        <span style="font-size: 10px; font-weight: 500;">AI Chat</span>
    </a>
</nav>

<script>
    const tabFiles = {
        watchlist: "watchlist_content.html",
        top10: "top10_content.html",
        jurnal: "portfolio_content.html",
        screening: "screening_content.html",
        cek_emiten: "cek_emiten_content.html",
        predictions: "predictions_content.html",
        ai_chat: "ai_chat_content.html"
    };
    
    const tabNames = {
        watchlist: "Watchlist",
        top10: "Top 10",
        jurnal: "Jurnal",
        screening: "Screening",
        cek_emiten: "Cek Emiten",
        predictions: "Prediksi Saham",
        ai_chat: "AI Chat"
    };
    
    const iframe = document.getElementById('content-frame');
    const pageTitle = document.getElementById('page-title');
    
    function switchTab(tabId) {
        iframe.src = tabFiles[tabId];
        pageTitle.textContent = tabNames[tabId];
        
        document.querySelectorAll('.tab-btn').forEach(btn => {
            if (btn.dataset.tab === tabId) {
                btn.classList.remove('tab-inactive');
                btn.classList.add('tab-active');
            } else {
                btn.classList.remove('tab-active');
                btn.classList.add('tab-inactive');
            }
        });
    }
    
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            e.preventDefault();
            switchTab(btn.dataset.tab);
        });
    });
    
    document.getElementById('refresh-btn').addEventListener('click', () => {
        iframe.src = iframe.src;
    });
</script>
</body>
</html>

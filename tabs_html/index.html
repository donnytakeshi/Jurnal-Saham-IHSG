<!DOCTYPE html>
<html class="dark">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { height: 100%; overflow: hidden; background: #0c141b; font-family: 'Inter', sans-serif; }
    .tab-active { color: #159D91; background-color: rgba(21,157,145,0.15); border-radius: 12px; }
    .tab-inactive { color: #8b919b; }
    #iframe-container { width: 100%; height: 100%; position: relative; }
    iframe { width: 100%; height: 100%; border: none; background: #0c141b; position: absolute; top: 0; left: 0; }
</style>
</head>
<body class="flex flex-col h-screen overflow-hidden">
    <header class="fixed top-0 left-0 w-full z-50 bg-[#0C141B]/90 backdrop-blur-md border-b border-white/10 px-4 flex justify-between items-center h-[56px]">
        <div class="flex items-center gap-2 w-1/4">
            <a href="profile.html" id="user-avatar-link" class="cursor-pointer">
                <span class="material-symbols-outlined text-[#8b919b]" id="user-avatar">account_circle</span>
            </a>
        </div>
        <div class="flex-grow text-center">
            <h1 class="font-bold text-sm text-white tracking-wide" id="page-title">Watchlist</h1>
        </div>
        <div class="flex items-center justify-end gap-3 w-1/4">
            <button class="bg-transparent border-none cursor-pointer text-[#8b919b]" id="logout-btn">
                <span class="material-symbols-outlined">logout</span>
            </button>
        </div>
    </header>

    <main class="flex-grow mt-[56px] mb-[64px] w-full h-full">
        <div id="iframe-container"></div>
    </main>

    <nav class="fixed bottom-0 left-0 w-full bg-[#0C141B]/90 backdrop-blur-md border-t border-white/10 z-50 h-[64px] flex items-center justify-around px-2">
        <div class="tab-btn tab-active flex flex-col items-center justify-center flex-1 py-1 rounded-xl cursor-pointer" data-tab="watchlist"><span class="material-symbols-outlined text-xl">trending_up</span><span class="text-[9px] mt-0.5">Watchlist</span></div>
        <div class="tab-btn tab-inactive flex flex-col items-center justify-center flex-1 py-1 rounded-xl cursor-pointer" data-tab="top10"><span class="material-symbols-outlined text-xl">format_list_numbered</span><span class="text-[9px] mt-0.5">Top 10</span></div>
        <div class="tab-btn tab-inactive flex flex-col items-center justify-center flex-1 py-1 rounded-xl cursor-pointer" data-tab="jurnal"><span class="material-symbols-outlined text-xl">menu_book</span><span class="text-[9px] mt-0.5">Jurnal</span></div>
        <div class="tab-btn tab-inactive flex flex-col items-center justify-center flex-1 py-1 rounded-xl cursor-pointer" data-tab="screening"><span class="material-symbols-outlined text-xl">search</span><span class="text-[9px] mt-0.5">Screening</span></div>
        <div class="tab-btn tab-inactive flex flex-col items-center justify-center flex-1 py-1 rounded-xl cursor-pointer" data-tab="cek_emiten"><span class="material-symbols-outlined text-xl">business</span><span class="text-[9px] mt-0.5">Cek</span></div>
        <div class="tab-btn tab-inactive flex flex-col items-center justify-center flex-1 py-1 rounded-xl cursor-pointer" data-tab="ai_chat"><span class="material-symbols-outlined text-xl">smart_toy</span><span class="text-[9px] mt-0.5">AI Chat</span></div>
    </nav>

<script>
    const tabFiles = {
        watchlist: "watchlist_content.html",
        top10: "top10_content.html",
        jurnal: "portfolio_content.html",
        screening: "screening_content.html",
        cek_emiten: "cek_emiten_content.html",
        ai_chat: "ai_chat_content.html"
    };
    const iframes = {};
    const container = document.getElementById('iframe-container');
    let portfolioMetrics = {};

    function loadTab(tabId) {
        if (!tabFiles[tabId]) return;

        // Hide all
        Object.values(iframes).forEach(iframe => iframe.style.display = 'none');

        // Lazy load & Show
        if (!iframes[tabId]) {
            const iframe = document.createElement('iframe');
            iframe.src = tabFiles[tabId];
            container.appendChild(iframe);
            iframes[tabId] = iframe;
        } else {
            iframes[tabId].style.display = 'block';
        }

        // UI Updates
        const titles = { watchlist: 'Watchlist', top10: 'Top 10', jurnal: 'Jurnal', screening: 'Screening', cek_emiten: 'Cek Emiten', ai_chat: 'AI Chat' };
        document.getElementById('page-title').innerText = titles[tabId] || tabId;
        document.querySelectorAll('.tab-btn').forEach(btn => {
            const isMatch = btn.getAttribute('data-tab') === tabId;
            btn.className = `tab-btn flex flex-col items-center justify-center flex-1 py-1 rounded-xl cursor-pointer ${isMatch ? 'tab-active' : 'tab-inactive'}`;
        });
    }

    // Attach Listeners
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => loadTab(btn.getAttribute('data-tab')));
    });

    // Message Bridge
    window.addEventListener('message', (event) => {
        const data = event.data;
        if (!data) return;

        if (data.type === 'PORTFOLIO_METRICS') {
            portfolioMetrics = data;
            if (iframes['watchlist']?.contentWindow) iframes['watchlist'].contentWindow.postMessage(data, '*');
        }
        if (data.type === 'REQUEST_PORTFOLIO_METRICS') {
            if (iframes['watchlist']?.contentWindow) iframes['watchlist'].contentWindow.postMessage({type: 'PORTFOLIO_METRICS', ...portfolioMetrics}, '*');
        }
        if (data.type === 'OPEN_STOCK' && data.stockCode) {
            loadTab('cek_emiten');
            setTimeout(() => {
                if (iframes['cek_emiten']?.contentWindow) iframes['cek_emiten'].contentWindow.postMessage({ type: 'SET_STOCK_CODE', stockCode: data.stockCode }, '*');
            }, 600);
        }
    });

    // Initial Load
    loadTab('watchlist');
</script>
</body>
</html>

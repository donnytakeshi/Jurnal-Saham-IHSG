<!DOCTYPE html>
<html class="dark">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
    body { background: #0c141b; font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
    .glass-card { background: rgba(20,28,35,0.8); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.08); }
    .btn-primary { background: #159D91; transition: all 0.2s; }
    .btn-primary:hover { background: #0f7a70; transform: scale(0.98); }
    .btn-guest { background: #2a2a2a; transition: all 0.2s; }
    .btn-guest:hover { background: #3a3a3a; transform: scale(0.98); }
</style>
</head>
<body class="min-h-screen flex flex-col">
    <div class="flex-1 flex items-center justify-center p-4">
        <div class="w-full max-w-md glass-card rounded-2xl p-6 shadow-2xl">
            <div class="text-center mb-6">
                <div class="text-3xl font-bold text-white mb-1">QuantFlow</div>
                <div class="text-sm text-slate-400">Jurnal Saham IHSG</div>
            </div>
            <form id="signin-form" class="space-y-5">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Email</label>
                    <input type="email" id="email" class="w-full bg-[#0c141b] border border-[#2a2a2a] rounded-xl py-3 px-4 text-white placeholder:text-slate-500 focus:border-teal-500 focus:outline-none" placeholder="nama@email.com">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Password</label>
                    <input type="password" id="password" class="w-full bg-[#0c141b] border border-[#2a2a2a] rounded-xl py-3 px-4 text-white placeholder:text-slate-500 focus:border-teal-500 focus:outline-none" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full btn-primary text-white font-semibold py-3 rounded-xl">Masuk</button>
            </form>
            <div class="mt-4">
                <button id="guest-btn" class="w-full btn-guest text-white font-semibold py-3 rounded-xl">Lanjutkan sebagai Tamu</button>
            </div>
            <div class="mt-6 text-center text-sm text-slate-400">
                Belum punya akun? <a href="signup.html" class="text-teal-400 hover:underline">Daftar</a>
            </div>
        </div>
    </div>
    <script>
        const SUPABASE_URL = 'https://ofnswkzbscuwoueromaf.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_Kp_J4xszV6GbIfsikhnT8w_CgqUQsp1';
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        document.getElementById('signin-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            if (!email || !password) return alert('Email dan password harus diisi');
            const { error } = await sb.auth.signInWithPassword({ email, password });
            if (error) alert(error.message);
            else {
                localStorage.removeItem('guest_mode');
                window.location.href = 'index.html';
            }
        });
        document.getElementById('guest-btn').addEventListener('click', () => {
            localStorage.setItem('guest_mode', 'true');
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
